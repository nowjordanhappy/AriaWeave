<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Galería de agencia</title>
<h1>Fotografías</h1>
<!-- A CMS that writes the caption into the filename and copies it into alt.
     Real, and common: CNN does it on every wire photo.

     The first image's alt is a full sentence a human wrote — reusing it costs
     nothing and beats any model. The second and third are identifiers wearing
     an extension, and must keep falling through: reusing those would announce
     "Getty Images 1338625942" to a screen reader. -->
<img id="caption" src="assets/plaza.png" width="320" height="200"
     alt="Manifestantes marchan por el centro de Lima durante la jornada de protesta.jpg">
<img id="identifier" src="assets/fuente.png" width="240" height="200"
     alt="GettyImages-1338625942.jpg">
<img id="cms" src="assets/tramite.png" width="220" height="200"
     alt="MINSA_Noticias_Placeholder_Generic.png">
