<!-- A Spanish page carrying an image whose text is entirely English. Ordinary
     on the real web: a supplier's banner, a partner logo, an untranslated PDF
     cover.

     It is here to provoke a genuine verifier rejection. A vision tier that
     transcribes what it sees answers in English; the page declares lang="es",
     so the language rule rejects it and the reason goes back as feedback for
     the retry. That is SPEC §6 criterion 3 happening for a real reason rather
     than a simulated one — nothing here stubs a tier or forces a failure.

     If the model answers in Spanish first time, no loop occurs and that is a
     result too. It must be reported, not engineered around. -->
