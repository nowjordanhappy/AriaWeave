<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Portada</title>
<h1>Noticias</h1>
<!-- Taken from elcomercio.pe. A promotional banner sits several levels above a
     search field that carries its own placeholder. An ancestor walk that climbs
     far enough finds the banner first and returns the whole pitch as the
     field's name, while the words written for the field itself go unused.

     Text authored for a region is not a label for a field inside it. -->
<div class="promo">
  <div class="promo__inner">
    <p>Entérate de todo, sin límites ni interrupciones. Suscríbete por S/12 al mes.</p>
  </div>
  <div class="header">
    <div class="header__row">
      <form>
        <input id="buscador" type="text" placeholder="Buscar en El Comercio">
      </form>
    </div>
  </div>
</div>
