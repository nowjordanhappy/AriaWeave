<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Carga dinámica</title>
<h1>Resultados</h1>
<div id="results"><p>Cargando…</p></div>
<script>
  // Arrives after first paint: the MutationObserver has to catch these, and
  // must not re-trigger itself when the extension writes its own attributes.
  setTimeout(() => {
    document.getElementById('results').innerHTML =
      '<img id="late-a" src="assets/plaza.svg" width="320" height="200">' +
      '<img id="late-b" src="assets/fuente.svg" width="240" height="200">' +
      '<button id="late-c" type="button">' +
      '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>';
  }, 400);
</script>
