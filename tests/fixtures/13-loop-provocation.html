<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Comunicado del proveedor</title>
<h1>Comunicados</h1>
<!-- SPEC §6 criterion 3, provoked by a real condition rather than a stub.
     Nothing here forces a tier to fail.

     The image carries an English `title`. T1 reuses authored text verbatim —
     that is its specced behaviour and it is usually right — so it answers in
     English. The page declares lang="es", so the verifier rejects it for
     language and the reason travels to the next rung as feedback, which then
     works from the image instead of the attribute.

     An untranslated title on a Spanish page is ordinary: a supplier's asset, a
     CMS field nobody filled in, an English CDN. Fixture 12 tried to provoke the
     same rejection through the image's own text and failed, because the prompt
     already asks for the page's language and the model translates rather than
     transcribes. The title is not passed through a model, so it survives. -->
<p>El proveedor envió este comunicado sin traducir.</p>
<img id="comunicado"
     src="assets/notice-english.png"
     title="Important notice from the supplier about the closure"
     width="620" height="260">
<p>Consultas en la oficina principal.</p>
